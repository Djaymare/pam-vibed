name: Dependency and embedded runtime security
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  pull_request:
    paths:
      - 'package*.json'
      - 'src-tauri/Cargo.*'
      - 'security/**'
      - 'scripts/*security*'
      - 'scripts/runtime-integrity.mjs'
      - 'scripts/prepare-runtime.mjs'
      - 'tests/runtime-security.test.mjs'
      - 'tests/workflow-security.test.mjs'
      - 'scripts/check-workflows.mjs'
      - '.github/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inventory-and-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot, 2026-10-18
        with:
          toolchain: '1.99.0'
      - run: npm ci --ignore-scripts
      - run: npm run check:workflows
      - run: node --test tests/workflow-security.test.mjs
      - run: node --test tests/runtime-security.test.mjs
      - run: npm run prepare:runtime
      - run: npm run security:sbom
      - run: npm run security:gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-security-evidence-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: false
          overwrite: false
          path: artifacts/security/
          if-no-files-found: error
