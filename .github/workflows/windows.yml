# Build/test only. Signing and publication require a separate protected workflow.
name: Prototype Windows x64
on:
  workflow_dispatch: null
  push:
    branches:
      - main
      - master
      - codex/deezer-routing
  pull_request: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npm run ci:quick
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: PAM-diagnostics-${{ github.job }}-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          path: |
            artifacts/ci/
            artifacts/webview-tests/
            artifacts/webview-cleanup/
  native-tests:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          workspaces: src-tauri
          prefix-key: pam-ci-v1
          key: ${{ github.ref_name }}
          cache-targets: false
          cache-bin: false
          cache-on-failure: false
      - run: npm ci
      - run: npm run ci:native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: PAM-diagnostics-${{ github.job }}-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          path: |
            artifacts/ci/
            artifacts/webview-tests/
            artifacts/webview-cleanup/
    needs:
      - quick
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - shell: bash
        run: |
          mkdir -p artifacts/ci/linux
          docker build --progress=plain -f Dockerfile.development -t pam-development . 2>&1 | tee artifacts/ci/linux/build.log
          docker run --rm pam-development 2>&1 | tee artifacts/ci/linux/checks.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: PAM-diagnostics-${{ github.job }}-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          path: |
            artifacts/ci/
            artifacts/webview-tests/
            artifacts/webview-cleanup/
    needs:
      - quick
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'npm' || '' }}
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          workspaces: src-tauri
          prefix-key: pam-ci-v1
          key: ${{ github.ref_name }}
          cache-targets: false
          cache-bin: false
          cache-on-failure: false
      - run: npm ci
      - run: npm run ci:integration
      - run: npm run ci:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PAM-ci-windows-x64-${{ github.sha }}-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*setup.exe
            artifacts/PAM-windows-x64/
            artifacts/ci/
        if: success()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: PAM-diagnostics-${{ github.job }}-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          path: |
            artifacts/ci/
            artifacts/webview-tests/
            artifacts/webview-cleanup/
    needs:
      - quick
      - native-tests
      - linux
